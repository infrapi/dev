# InfraPI dev stack: etcd, Kayra (serve and reconciler) and APISIX as the
# gateway in front of Kayra and of the APIs you develop. Nothing reaches
# outside the stack's network once the images are pulled.
#
#   make up        renders .infrapi-dev/ from dev.yaml, then podman compose up -d
#
# The ${...} come from .infrapi-dev/env (podman compose --env-file), the
# configuration Kayra runs with from .infrapi-dev/kayra.yaml: both rendered
# from dev.yaml. See docs/dev-stack.md.

name: infrapi-dev

services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.5
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
    volumes:
      - etcd-data:/etcd-data
    ports:
      - "127.0.0.1:${ETCD_PORT}:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - infrapi

  apisix:
    image: docker.io/apache/apisix:3.19.0-debian
    restart: always
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro,z
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:9080/tcp"      # gateway: Kayra and your APIs
      - "127.0.0.1:${ADMIN_PORT}:9180/tcp"        # Admin API and its UI at /ui, keys in apisix/config.yaml
      - "127.0.0.1:${PROMETHEUS_PORT}:9091/tcp"   # prometheus
      - "127.0.0.1:${CONTROL_PORT}:9092/tcp"      # control API
      - "127.0.0.1:${GATEWAY_TLS_PORT}:9443/tcp"  # gateway, TLS
    # podman resolves host.containers.internal to the host: a route reaches
    # an API running there, see make api-add
    networks:
      - infrapi

  # loads the stack's routes (.infrapi-dev/routes) into APISIX, then exits:
  # Kayra's image has sh and curl
  gateway-init:
    image: ${KAYRA_IMAGE}
    pull_policy: ${KAYRA_PULL_POLICY}
    entrypoint: ["sh", "/apisix/routes.sh", "/routes"]
    environment:
      APISIX_ADMIN_URL: http://apisix:9180
    volumes:
      - ./apisix/routes.sh:/apisix/routes.sh:ro,z
      - ./.infrapi-dev/routes:/routes:ro,z
    depends_on:
      apisix:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - infrapi

  kayra:
    # dev.yaml's kayra.image, or kayra-dev:local built by `make build` from
    # kayra.src (podman compose cannot pass a checkout as a build context)
    image: ${KAYRA_IMAGE}
    pull_policy: ${KAYRA_PULL_POLICY}
    command: ["serve"]
    volumes: &kayra-config
      - ./.infrapi-dev/kayra.yaml:/etc/kayra/kayra.yaml:ro,z
      - ./.infrapi-dev/users.yaml:/etc/kayra/kayra-users.yaml:ro,z
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAYRA_PORT}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081${KAYRA_HEALTHZ}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - infrapi

  reconciler:
    # the same image and configuration, signing keys included
    image: ${KAYRA_IMAGE}
    pull_policy: ${KAYRA_PULL_POLICY}
    command: ["reconciler"]
    volumes: *kayra-config
    depends_on:
      etcd:
        condition: service_healthy
      kayra:
        condition: service_healthy
      gateway-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - infrapi

  # an upstream to try routes and plugins on, at /httpbin/* through APISIX
  httpbin:
    image: docker.io/kennethreitz/httpbin
    restart: always
    networks:
      - infrapi

volumes:
  etcd-data:

networks:
  infrapi:
    driver: bridge
