# Users of the "local" provider: a stand-in for LDAP. Mint a token for one
# of them with
#
#   kayra token mint --provider local --subject <id>
#
# and its groups are resolved from here, live: edit the file, restart
# kayra, and the next request sees the change (after the users cache, see
# `kayra cache clean --scope users`).
users:
  # In sysadmin.groups: reaches the cluster endpoints (namespaces, api
  # registrations, cluster RBAC).
  - id: admin
    password: "admin" # dev only, plaintext; unused, no password login
    attributes:
      email: admin@infrapi.io
      name: Dev Admin
    groups:
      - sandbox-core-sysadmin

  # A tenant user: what it may do comes from the RBAC you create.
  - id: jdoe
    password: "s3cret"
    attributes:
      email: jdoe@infrapi.io
      name: John Doe
    groups:
      - sandbox-thetenant-admins

  # A user with no group at all: authenticated, authorized for nothing.
  - id: nobody
    password: "nobody"
    attributes:
      email: nobody@infrapi.io
      name: No Body
    groups: []
